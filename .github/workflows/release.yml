name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Final acceptance gates
        run: |
          pnpm contracts:generate
          pnpm contracts:verify
          pnpm check-deps
          pnpm check-boundaries
          pnpm check-contracts
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check-phase4
          pnpm check-phase5
          pnpm check-phase6
          pnpm check-phase7
          pnpm check-phase8
          pnpm check-a11y
          pnpm check-visual

      - name: Build desktop shell
        run: pnpm --filter @gem-duel/desktop build

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            apps/desktop/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
