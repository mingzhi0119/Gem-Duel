asyncapi: 3.0.0
channels:
  roomStream:
    address: /ws/rooms/{roomId}
    description: Bidirectional room lifecycle and match event stream.
    messages:
      MatchCommandMessage:
        $ref: "#/components/messages/MatchCommandMessage"
      MatchObserveMessage:
        $ref: "#/components/messages/MatchObserveMessage"
      MatchPatchMessage:
        $ref: "#/components/messages/MatchPatchMessage"
      MatchResyncMessage:
        $ref: "#/components/messages/MatchResyncMessage"
      RoomErrorMessage:
        $ref: "#/components/messages/RoomErrorMessage"
      RoomJoinMessage:
        $ref: "#/components/messages/RoomJoinMessage"
      RoomLeaveMessage:
        $ref: "#/components/messages/RoomLeaveMessage"
      RoomStateMessage:
        $ref: "#/components/messages/RoomStateMessage"
      RoomWatchMessage:
        $ref: "#/components/messages/RoomWatchMessage"
    parameters:
      roomId:
        description: Authoritative room identifier.
        examples:
          - room-1
components:
  messages:
    MatchCommandMessage:
      name: match.command
      payload:
        $ref: "#/components/schemas/MatchCommandMessage"
      summary: Client submits a deterministic match command.
      title: MatchCommandMessage
    MatchObserveMessage:
      name: match.observe
      payload:
        $ref: "#/components/schemas/MatchObserveMessage"
      summary: Server streams spectator-safe snapshots.
      title: MatchObserveMessage
    MatchPatchMessage:
      name: match.patch
      payload:
        $ref: "#/components/schemas/MatchPatchMessage"
      summary: Server broadcasts a new filtered snapshot patch.
      title: MatchPatchMessage
    MatchResyncMessage:
      name: match.resync
      payload:
        $ref: "#/components/schemas/MatchResyncMessage"
      summary: Server resynchronizes a client after a sequence mismatch.
      title: MatchResyncMessage
    RoomErrorMessage:
      name: room.error
      payload:
        $ref: "#/components/schemas/RoomErrorMessage"
      summary: Server reports an authoritative room error.
      title: RoomErrorMessage
    RoomJoinMessage:
      name: room.join
      payload:
        $ref: "#/components/schemas/RoomJoinMessage"
      summary: Client requests to join an online room.
      title: RoomJoinMessage
    RoomLeaveMessage:
      name: room.leave
      payload:
        $ref: "#/components/schemas/RoomLeaveMessage"
      summary: Client leaves the room stream.
      title: RoomLeaveMessage
    RoomStateMessage:
      name: room.state
      payload:
        $ref: "#/components/schemas/RoomStateMessage"
      summary: Server sends the visible room detail snapshot.
      title: RoomStateMessage
    RoomWatchMessage:
      name: room.watch
      payload:
        $ref: "#/components/schemas/RoomWatchMessage"
      summary: Client enters spectator mode for a room.
      title: RoomWatchMessage
  schemas:
    ActiveEffect:
      properties:
        atom:
          enum:
            - grant_privilege
            - take_opponent_token
            - gain_royal
            - take_extra_turn
            - discard_to_limit
            - take_board_token
            - override_bonus_color
          type: string
        effectId:
          minLength: 1
          type: string
        hookPoint:
          enum:
            - BEFORE_USE_PRIVILEGE
            - AFTER_USE_PRIVILEGE
            - BEFORE_REPLENISH_BOARD
            - AFTER_REPLENISH_BOARD
            - BEFORE_TAKE_TOKENS
            - AFTER_TAKE_TOKENS
            - BEFORE_RESERVE_CARD
            - AFTER_RESERVE_CARD
            - BEFORE_BUY_CARD
            - AFTER_BUY_CARD
            - BEFORE_GAIN_ROYAL
            - AFTER_GAIN_ROYAL
            - BEFORE_EXTRA_TURN
            - AFTER_EXTRA_TURN
            - BEFORE_DISCARD_TO_LIMIT
            - AFTER_DISCARD_TO_LIMIT
            - BEFORE_VICTORY_CHECK
            - AFTER_VICTORY_CHECK
            - BEFORE_MATCH_SETUP
            - AFTER_MATCH_SETUP
            - BEFORE_BUFF_ACQUISITION
            - AFTER_BUFF_ACQUISITION
            - BEFORE_RUN_REWARD_SELECTION
            - AFTER_RUN_REWARD_SELECTION
          type: string
        owner:
          enum:
            - p1
            - p2
          type:
            - string
            - "null"
        parentEffectId:
          minLength: 1
          type:
            - string
            - "null"
        rngNamespace:
          minLength: 1
          type: string
        scope:
          enum:
            - active_player
            - opposing_player
            - global_match
            - global_run
          type: string
        sequence:
          minimum: 0
          type: integer
        source:
          enum:
            - optional_action
            - mandatory_action
            - card_ability
            - royal_reward
            - buff_hook
            - end_of_turn
            - run_reward
          type: string
        stage:
          enum:
            - scheduled
            - running
            - completed
          type: string
      required:
        - effectId
        - parentEffectId
        - atom
        - hookPoint
        - source
        - scope
        - owner
        - sequence
        - stage
        - rngNamespace
      type: object
