info:
  description: Authoritative room-service WebSocket protocol with filtered snapshots and Step 02.5 effect lifecycle envelopes.
  title: Gem Duel Realtime Contracts
  version: 4.0.0
operations:
  joinRoomSocket:
    action: send
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/RoomJoinMessage"
    summary: Client requests to join an online room.
  leaveRoomSocket:
    action: send
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/RoomLeaveMessage"
    summary: Client leaves the room stream.
  observeMatchSocket:
    action: receive
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/MatchObserveMessage"
    summary: Server streams spectator-safe snapshots.
  receiveMatchPatch:
    action: receive
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/MatchPatchMessage"
    summary: Server broadcasts a new filtered snapshot patch.
  receiveMatchResync:
    action: receive
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/MatchResyncMessage"
    summary: Server resynchronizes a client after a sequence mismatch.
  receiveRoomError:
    action: receive
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/RoomErrorMessage"
    summary: Server reports an authoritative room error.
  receiveRoomState:
    action: receive
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/RoomStateMessage"
    summary: Server sends the visible room detail snapshot.
  submitMatchCommand:
    action: send
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/MatchCommandMessage"
    summary: Client submits a deterministic match command.
  watchRoomSocket:
    action: send
    channel:
      $ref: "#/channels/roomStream"
    messages:
      - $ref: "#/channels/roomStream/messages/RoomWatchMessage"
    summary: Client enters spectator mode for a room.
servers:
  roomService:
    description: Local room-service realtime transport.
    host: "{host}"
    pathname: /ws/rooms/{roomId}
    protocol: ws
    variables:
      host:
